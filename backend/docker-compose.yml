# Local dev infra only: Postgres for app state, Redis for the RQ job queue.
# App and workers run on the host (or in their own containers later) and
# connect to these via DATABASE_URL / REDIS_URL in .env.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clipping_machine
      POSTGRES_PASSWORD: clipping_machine
      POSTGRES_DB: clipping_machine
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipping_machine"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
